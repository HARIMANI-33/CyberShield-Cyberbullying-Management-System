# Server Configuration
server.port=8080

# Application Details
spring.application.name=CyberShield

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/cybershield_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&connectTimeout=2000&socketTimeout=2000
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool Settings (graceful initialization if DB starts later)
spring.datasource.hikari.initialization-fail-timeout=-1

# Spring Data JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
